[package]
name = "sofa-reader"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/sofa-reader"
keywords = ["sofa", "hrtf", "hdf5", "netcdf", "audio"]
categories = ["multimedia::audio", "parser-implementations"]
description = "Pure-Rust SOFA (HDF5/NetCDF4) file reader and writer for HRTF data"

[features]
default = ["deflate", "sqlite"]
deflate = ["dep:flate2"]
# SQLite `.hrtfdb` cache loading (pulls in rusqlite + bincode).
sqlite = ["dep:rusqlite", "dep:bincode"]

[dependencies]
thiserror = "2.0.17"
flate2 = { version = "1.1.10", optional = true }
log = "0.4.28"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.38", optional = true }
bincode = { version = "2.0.1", features = ["serde"], optional = true }

[dev-dependencies]
tempfile = "3.23"
proptest = "1.9"

[patch.crates-io]
# Match GPUI compatibility forks: workspace patches are not inherited.
rusty-fork = { git = "https://github.com/pierreaubert/rusty-fork.git", rev = "ee62bcd64fa6afe7fae0e52a448d716dc294e98d" }

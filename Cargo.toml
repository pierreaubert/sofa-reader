[package]
name = "sofa-reader"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/sofa-reader"
keywords = ["sofa", "hrtf", "hdf5", "netcdf", "audio"]
categories = ["multimedia::audio", "parser-implementations"]
description = "Pure-Rust SOFA (HDF5/NetCDF4) file reader and writer for HRTF data"

# Own workspace root: with no [workspace] table, cargo walks up to the
# all_of_sotf aggregate manifest and this crate silently joins the mono
# workspace even for standalone builds (wrong lockfile, config, and resolve).
[workspace]

[features]
default = ["deflate", "sqlite"]
deflate = ["dep:flate2"]
# SQLite `.hrtfdb` cache loading (pulls in rusqlite + bincode).
sqlite = ["dep:rusqlite", "dep:bincode"]

[[bin]]
name = "sofa-to-sqlite"
path = "src/bin/sofa_to_sqlite.rs"
required-features = ["sqlite"]

[dependencies]
thiserror = "2"
flate2 = { version = "1", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", optional = true }
bincode = { version = "2.0.1", features = ["serde"], optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
proptest = "1"

# Match GPUI compatibility forks: workspace patches are not inherited.

[package]
name = "sofa-reader"
version = "0.1.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/sofa-reader"
keywords = ["sofa", "hrtf", "hdf5", "netcdf", "audio"]
categories = ["multimedia::audio", "parser-implementations"]
description = "Pure-Rust SOFA (HDF5/NetCDF4) file reader and writer for HRTF data"

[features]
default = ["deflate"]
deflate = ["dep:flate2"]

[dependencies]
thiserror = "2.0.17"
flate2 = { version = "1.1", optional = true }
log = "0.4.28"
serde = { version = "1.0", features = ["derive"] }
rusqlite = "0.38"
bincode = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.23"
proptest = "1.9"
